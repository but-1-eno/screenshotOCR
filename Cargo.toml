[package]
name = "screenshot_ocr"
version = "0.1.0"
edition = "2021"
description = "Background Windows screenshot OCR core"
license = "MIT"

[dependencies]
anyhow = "1"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
